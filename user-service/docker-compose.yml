services:
  user-db:
    image: mariadb:latest
    container_name: user-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user-db
      MYSQL_USER: minguni
      MYSQL_PASSWORD: minguni
    volumes:
      - user-db-data:/var/lib/mysql
  user-service-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: user-service:latest
    container_name: user-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://host.docker.internal:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mariadb://host.docker.internal:3309/user-db
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6381
      - JAVA_OPTS=-Xms512m -Xmx1g
      - EUREKA_INSTANCE_IP_ADDRESS=host.docker.internal
    volumes:
      - ./logs:/app/logs
    depends_on:
      - user-db
      - redis
  redis:
    image: redis:latest
    container_name: user-redis
    ports:
      - "6381:6379"
    volumes:
      - user-redis-data:/data

volumes:
  user-db-data:
  user-redis-data: