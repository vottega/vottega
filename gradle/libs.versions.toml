[versions]
kotlin        = "1.9.25"
spring-boot   = "3.3.2"
spring-cloud  = "2023.0.3"
avro-plugin   = "1.9.1"


[plugins]
kotlin-jvm                = { id = "org.jetbrains.kotlin.jvm",              version.ref = "kotlin" }
kotlin-spring             = { id = "org.jetbrains.kotlin.plugin.spring",    version.ref = "kotlin" }
kotlin-jpa                = { id = "org.jetbrains.kotlin.plugin.jpa",       version.ref = "kotlin" }
spring-boot               = { id = "org.springframework.boot",              version.ref = "spring-boot" }
spring-dep-mgmt           = { id = "io.spring.dependency-management",       version = "1.1.6" }
avro                      = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avro-plugin" }


[boms]
spring-cloud              = { group = "org.springframework.cloud", artifact = "spring-cloud-dependencies", version.ref = "spring-cloud" }


[libraries]
spring-boot-starter-web          = { module = "org.springframework.boot:spring-boot-starter-web",          version.ref = "spring-boot" }
spring-boot-starter-webflux      = { module = "org.springframework.boot:spring-boot-starter-webflux",      version.ref = "spring-boot" }
spring-boot-starter-data-jpa     = { module = "org.springframework.boot:spring-boot-starter-data-jpa",     version.ref = "spring-boot" }
spring-boot-starter-data-redis   = { module = "org.springframework.boot:spring-boot-starter-data-redis",   version.ref = "spring-boot" }
spring-boot-starter-security     = { module = "org.springframework.boot:spring-boot-starter-security",     version.ref = "spring-boot" }
spring-boot-starter-test         = { module = "org.springframework.boot:spring-boot-starter-test",         version.ref = "spring-boot" }
spring-boot-starter-actuator     = { module = "org.springframework.boot:spring-boot-starter-actuator",     version.ref = "spring-boot" }


spring-cloud-eureka-client       = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client", version.ref = "spring-cloud" }
spring-cloud-openfeign           = { module = "org.springframework.cloud:spring-cloud-starter-openfeign",             version.ref = "spring-cloud" }
spring-cloud-gateway             = { module = "org.springframework.cloud:spring-cloud-starter-gateway",             version.ref = "spring-cloud" }


jackson-kotlin                   = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version = "2.17.0" }
mariadb-driver                   = { module = "org.mariadb.jdbc:mariadb-java-client",   version = "3.3.3" }
mysql-driver                     = { module = "com.mysql:mysql-connector-j",            version = "8.4.0" }
kafka-spring                     = { module = "org.springframework.kafka:spring-kafka", version = "3.2.3" }


spring-cloud-bom                 = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }